[package]
name = "stem-app"
description = "Stem, a floating dock for Windows 11 (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stem"
path = "src/main.rs"

[lib]
name = "stem_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
stem-core = { workspace = true }
stem-platform = { workspace = true }
stem-service = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-log = { workspace = true }
tauri-plugin-single-instance = { workspace = true }

# Only for the context-menu popup helper in `menus.rs`: post
# `WM_NULL` after `TrackPopupMenu` and hand the foreground back. Everything
# else that is Win32 lives in `stem-platform`.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
