[package]
name = "stem-platform"
description = "Platform abstraction for Stem: the trait, a scripted mock, and the Windows implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Diagnostic programs under examples/ and src/windows/probe/. Off by
# default; the app never enables it. The extra `windows` features (kept
# sorted) are the ones only the probes use.
probes = [
    "windows/Win32_Security",
    "windows/Win32_System_Console",
    "windows/Win32_System_Performance",
]

[[example]]
name = "thumbnail-probe"
required-features = ["probes"]

[dependencies]
stem-core = { workspace = true }
crossbeam-channel = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
png = { workspace = true }
thiserror = { workspace = true }

# Keep this list sorted. Enable a feature only when a symbol needs it; the
# compiler error names the missing feature.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
